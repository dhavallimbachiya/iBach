# Static WordPress export. Publish the repository root with no build step so
# the header logo rules travel with the HTML instead of depending on a UI
# publish directory or a build that can leave the previous deploy in place.
[build]
  publish = "."
  command = "echo static site"

# Old paths. Insights was removed; physician content lives at /physicians/.
[[redirects]]
  from = "/insights"
  to = "/physicians/"
  status = 301

[[redirects]]
  from = "/insights/"
  to = "/physicians/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
